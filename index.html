<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard: Estilo Oscuro - Santa Cruz</title>
    
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Plugin Leaflet.snogylop para invertir el polígono -->
    <script src="https://unpkg.com/leaflet.snogylop@0.4.0/src/leaflet.snogylop.js"></script>

    <style>
        body { 
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #000; 
        }
        #map { height: 100vh; width: 100%; background-color: #000; }
        
        /* Botón de descarga */
        #download-btn {
            position: absolute; top: 15px; right: 15px; z-index: 1000;
            padding: 10px 15px; background-color: #1e1e1e; color: #00e5ff;
            border: 1px solid #00e5ff; border-radius: 5px; cursor: pointer;
            font-weight: bold; box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            transition: all 0.3s;
        }
        #download-btn:hover { background-color: #00e5ff; color: #000; }

        /* --- ESTILOS OSCUROS PARA LOS POPUPS DE LEAFLET --- */
        .leaflet-popup-content-wrapper {
            background-color: #111 !important;
            color: #fff !important;
            border: 1px solid #333;
            border-radius: 8px;
            box-shadow: 0 3px 14px rgba(0,0,0,0.8);
        }
        .leaflet-popup-tip { background-color: #111 !important; }
        .leaflet-container a.leaflet-popup-close-button { color: #888; }
        
        /* --- ESTILOS OSCUROS PARA LOS CONTROLES DE ZOOM --- */
        .leaflet-bar a {
            background-color: #1e1e1e !important;
            color: #fff !important;
            border-bottom: 1px solid #333 !important;
        }
        .leaflet-bar a:hover { background-color: #333 !important; }

        /* --- LEYENDA (OPCIONAL) --- */
        .info.legend {
            background: rgba(15, 15, 15, 0.8);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #333;
            color: #ccc;
            font-size: 12px;
            line-height: 1.5;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .info.legend i { width: 18px; height: 3px; display: inline-block; margin-right: 8px; vertical-align: middle; }
    </style>
</head>
<body>

    <button id="download-btn">📥 Descargar HTML</button>
    <div id="map"></div>

    <script>
        // --- 1. CONFIGURACIÓN DEL MAPA BASE (TEMA OSCURO) ---
        var map = L.map('map', { zoomControl: false }).setView([-17.783, -63.182], 9);

        // Capa base oscura (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CartoDB</a> &copy; OpenStreetMap',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        // Añadir controles de zoom en la esquina superior izquierda
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // Capas
        var pinesLayer = L.layerGroup().addTo(map);
        var redVialLayer = L.layerGroup().addTo(map);
        
        var datosRedVial = null;

        // --- 2. CARGAR LÍMITES DE SANTA CRUZ Y CREAR MÁSCARA ---
        fetch('santa_cruz.geojson')
            .then(res => res.json())
            .then(data => {
                // A. La Máscara Oscura (Rellena todo el exterior de negro)
                L.geoJSON(data, {
                    invert: true, // Invierte el polígono
                    style: {
                        color: 'none',          // Sin borde exterior
                        fillColor: '#000000',   // Relleno negro
                        fillOpacity: 0.85       // Opacidad para "apagar" el resto de Bolivia
                    }
                }).addTo(map);

                // B. El Borde de Santa Cruz (Línea cian brillante)
                L.geoJSON(data, {
                    style: {
                        color: '#00e5ff',       // Color cian
                        weight: 2,
                        opacity: 0.8,
                        fillOpacity: 0        // Sin relleno para que se vea el mapa interior
                    }
                }).addTo(map);
            })
            .catch(err => console.warn('No se pudo cargar santa_cruz.geojson', err));

        // --- 3. CARGAR RED VIAL (ESTILO NARANJA) ---
        fetch('rutas_scz.geojson')
            .then(res => res.json())
            .then(data => {
                datosRedVial = data;
                dibujarPines();
                actualizarFiltroRedVial();
            })
            .catch(err => {
                console.warn('No se pudo cargar rutas_scz.geojson', err);
                dibujarPines();
            });

        // --- 4. DIBUJAR PINES (ESTILO ROJO CIRCULAR) ---
        var puntosData = [
            { lat: -17.783, lng: -63.182, nombre: "Estación Central", info: "Tráfico: Alto" },
            { lat: -17.750, lng: -63.150, nombre: "Estación Norte", info: "Tráfico: Medio" },
            { lat: -17.810, lng: -63.210, nombre: "Estación Sur", info: "Tráfico: Bajo" },
            // ... Añade tus 42 puntos aquí
        ];

        function dibujarPines() {
            pinesLayer.clearLayers();
            puntosData.forEach(p => {
                // Usamos circleMarker en lugar del marcador de gota por defecto
                var marker = L.circleMarker([p.lat, p.lng], {
                    radius: 6,
                    fillColor: "#ff2a2a", // Rojo brillante
                    color: "#ff2a2a",     // Borde rojo
                    weight: 2,
                    opacity: 0.6,         // Borde semitransparente (efecto halo)
                    fillOpacity: 1
                });

                var popupContent = `
                    <div style="font-family: sans-serif;">
                        <h4 style="margin: 0 0 5px 0; color: #00e5ff;">${p.nombre}</h4>
                        <p style="margin: 0; font-size: 13px;">${p.info}</p>
                    </div>
                `;
                marker.bindPopup(popupContent);
                pinesLayer.addLayer(marker);
            });
        }

        // --- 5. FILTRO DINÁMICO RED VIAL (ESTILO NARANJA) ---
        function actualizarFiltroRedVial() {
            if (!datosRedVial) return;
            var bounds = map.getBounds().pad(0.2);
            var coordsPines = puntosData.map(p => L.latLng(p.lat, p.lng));

            redVialLayer.clearLayers();
            
            L.geoJSON(datosRedVial, {
                style: {
                    color: '#f39c12', // Naranja/Dorado para las carreteras
                    weight: 2,        // Más delgadas y elegantes
                    opacity: 0.8
                },
                filter: function(feature) {
                    if (feature.geometry.type === 'LineString') {
                        return feature.geometry.coordinates.some(coord => {
                            var latlng = L.latLng(coord[1], coord[0]);
                            var cercaDePin = coordsPines.some(pin => latlng.distanceTo(pin) < 8000);
                            return bounds.contains(latlng) || cercaDePin;
                        });
                    }
                    return true;
                }
            }).addTo(redVialLayer);
        }

        map.on('moveend', actualizarFiltroRedVial);

        // --- 6. BOTÓN DE DESCARGA ---
        document.getElementById('download-btn').addEventListener('click', function() {
            var blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'dashboard_santa_cruz_dark.html';
            a.click();
            URL.revokeObjectURL(url);
        });

        // --- 7. AÑADIR LEYENDA EN LA ESQUINA ---
        var legend = L.control({position: 'bottomleft'});
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info legend');
            div.innerHTML = `
                <div style="margin-bottom: 5px; font-weight: bold; color: #fff;">REFERENCIAS</div>
                <div><i style="background: #00e5ff;"></i> Límite Santa Cruz</div>
                <div><i style="background: #f39c12;"></i> Red vial fundamental</div>
                <div style="margin-top: 8px; font-size: 10px; color: #666;">Datos: OpenStreetMap</div>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
