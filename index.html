<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard: Red Vial + Máscara Santa Cruz</title>
    
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Plugin Leaflet.snogylop para invertir polígonos -->
    <script src="https://unpkg.com/leaflet.snogylop@0.4.0/src/leaflet.snogylop.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        #download-btn {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            padding: 10px 15px; background-color: #2c3e50; color: white;
            border: none; border-radius: 5px; cursor: pointer;
        }
        .popup-content h3 { margin: 0 0 5px 0; color: #2c3e50; }
    </style>
</head>
<body>

    <button id="download-btn">📥 Descargar HTML</button>
    <div id="map"></div>

    <script>
        // --- 1. MAPA BASE ---
        var map = L.map('map').setView([-17.783, -63.182], 9); // Zoom inicial para ver Santa Cruz

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        // Capas para organizar los elementos
        var redVialLayer = L.layerGroup().addTo(map);
        var pinesLayer = L.layerGroup().addTo(map);
        var mascaraLayer = L.layerGroup().addTo(map); // Aquí irá la máscara

        var datosRedVial = null;
        var geojsonSantaCruz = null;

        // --- 2. CARGAR EL GEOJSON DE SANTA CRUZ (MÁSCARA) ---
        fetch('santa_cruz.geojson') // Archivo descargado del repositorio CIRCPyCS o HDX
            .then(res => res.json())
            .then(data => {
                geojsonSantaCruz = data;
                crearMascaraSantaCruz();
            })
            .catch(err => console.warn('No se pudo cargar santa_cruz.geojson. La máscara no se mostrará.', err));

        function crearMascaraSantaCruz() {
            // Usamos Leaflet.snogylop: creamos una capa GeoJSON con la opción "invert: true"
            // Esto cubrirá todo el mundo excepto el polígono de Santa Cruz.
            L.geoJSON(geojsonSantaCruz, {
                invert: true, // <-- La clave para invertir el polígono
                style: {
                    color: '#000',          // Color del borde (opcional)
                    weight: 1,
                    opacity: 0.3,
                    fillColor: '#000',      // Color de relleno de la máscara
                    fillOpacity: 0.6        // Ajusta la opacidad para que el fondo se vea más o menos oscuro
                }
            }).addTo(mascaraLayer);
        }

        // --- 3. CARGAR LA RED VIAL (igual que antes) ---
        fetch('rutas_scz.geojson')
            .then(res => res.json())
            .then(data => {
                datosRedVial = data;
                dibujarPines(); // Dibujamos pines una vez cargado todo
                actualizarFiltroRedVial();
            })
            .catch(err => {
                console.warn('No se pudo cargar rutas_scz.geojson.', err);
                dibujarPines();
            });

        // --- 4. PINES (ejemplo) ---
        var puntosData = [
            { lat: -17.783, lng: -63.182, nombre: "Punto Central", info: "Información del ping 1" },
            { lat: -17.750, lng: -63.150, nombre: "Punto Norte", info: "Información del ping 2" }
        ];

        function dibujarPines() {
            pinesLayer.clearLayers();
            puntosData.forEach(p => {
                L.marker([p.lat, p.lng])
                 .bindPopup(`<div class="popup-content"><h3>${p.nombre}</h3><p>${p.info}</p></div>`)
                 .addTo(pinesLayer);
            });
        }

        // --- 5. FILTRO DINÁMICO DE LA RED VIAL (igual que antes) ---
        function actualizarFiltroRedVial() {
            if (!datosRedVial) return;
            var bounds = map.getBounds().pad(0.2);
            var coordsPines = puntosData.map(p => L.latLng(p.lat, p.lng));

            redVialLayer.clearLayers();
            L.geoJSON(datosRedVial, {
                style: { color: '#e74c3c', weight: 3, opacity: 0.8 },
                filter: function(feature) {
                    if (feature.geometry.type === 'LineString') {
                        return feature.geometry.coordinates.some(coord => {
                            var latlng = L.latLng(coord[1], coord[0]);
                            var cercaDePin = coordsPines.some(pin => latlng.distanceTo(pin) < 5000);
                            return bounds.contains(latlng) || cercaDePin;
                        });
                    }
                    return true;
                }
            }).addTo(redVialLayer);
        }

        map.on('moveend', actualizarFiltroRedVial);

        // --- 6. BOTÓN DE DESCARGA (igual que antes) ---
        document.getElementById('download-btn').addEventListener('click', function() {
            var blob = new Blob([document.documentElement.outerHTML], { type: 'text/html' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'dashboard_santa_cruz.html';
            a.click();
            URL.revokeObjectURL(url);
        });

    </script>
</body>
</html>
